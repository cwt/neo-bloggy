[app]
# Secret key for Flask sessions and CSRF protection
secret_key = "your-secret-key-here"
# IP address to bind the server to
ip = "0.0.0.0"
# Port to run the server on
port = 5000
# Site metadata
site_title = "Neo Bloggy"
site_author = "Neo Bloggy"
site_description = "Modern Blogging Platform"
# External URL for the site (used for sitemap.xml and other external links)
# Example: "https://yourdomain.com/" - must include trailing slash
base_url = ""

[database]
# Path to the NeoSQLite database file
db_path = "/data/neo-bloggy.db"

[caching]
# Enable or disable caching mechanism
cache_enabled = false
# Cache timeout in seconds (default: 5 minutes)
cache_timeout = 300

[posts]
# Number of posts to display per page
posts_per_page = 10

# Maximum posts per page allowed (to prevent abuse)
max_posts_per_page = 50

[caching.storage]
# Cache storage type: 'memory' or 'file'
type = "file"

# Directory for file-based cache (only used if type = "file")
cache_dir = "/data/cache/"

# Maximum cache size in MB (only used if type = "file")
max_size_mb = 100

[file_uploads]
# Maximum file upload size in bytes (16MB = 16 * 1024 * 1024)
max_content_length = 16777216
